services:
  db:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: dentaflow
      POSTGRES_USER: dentaflow_owner
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?Set DB_OWNER_PASSWORD}
      POSTGRES_RUNTIME_PASSWORD: ${DB_RUNTIME_PASSWORD:?Set DB_RUNTIME_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql
      - ./init-runtime.sql:/docker-entrypoint-initdb.d/10-runtime.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U dentaflow_owner -d dentaflow']
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build: { context: .., target: migrations }
    environment:
      DATABASE_URL: postgresql://dentaflow_owner:${DB_OWNER_PASSWORD}@db:5432/dentaflow?schema=public
    depends_on:
      db: { condition: service_healthy }
    restart: 'no'
  app:
    build: { context: .., target: runtime }
    restart: unless-stopped
    env_file: ../.env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://dentaflow_runtime:${DB_RUNTIME_PASSWORD}@db:5432/dentaflow?schema=public
      HOST: 0.0.0.0
      PORT: 4000
      STORAGE_PATH: /app/storage
    volumes: ['documents:/app/storage']
    depends_on:
      migrate: { condition: service_completed_successfully }
  seed:
    build: { context: .., target: migrations }
    env_file: ../.env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://dentaflow_runtime:${DB_RUNTIME_PASSWORD}@db:5432/dentaflow?schema=public
    command: ['npm', 'run', 'db:seed']
    profiles: [setup]
    depends_on:
      migrate: { condition: service_completed_successfully }
  jobs:
    build: { context: .., target: runtime }
    env_file: ../.env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://dentaflow_runtime:${DB_RUNTIME_PASSWORD}@db:5432/dentaflow?schema=public
    command: ['node', 'dist-server/jobs.js']
    profiles: [jobs]
    depends_on:
      migrate: { condition: service_completed_successfully }
  proxy:
    image: caddy:2
    restart: unless-stopped
    environment:
      PRIMARY_DOMAIN: ${PRIMARY_DOMAIN:?Set PRIMARY_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    ports: ['80:80', '443:443']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on: [app]
volumes:
  postgres:
  documents:
  caddy:
